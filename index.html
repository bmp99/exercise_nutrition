<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hybrid Training Pro</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --success: #22c55e; --warning: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 75px; -webkit-tap-highlight-color: transparent; }
    header { padding: 16px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { flex: 1; text-align: center; font-size: 0.75rem; color: var(--muted); border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; cursor: pointer; }
    .nav-item.active { color: var(--accent); font-weight: 600; }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .badge-green { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .timer-box { background: #0b1120; border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
    .timer-display { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-block { width: 100%; display: block; padding: 14px; margin-top: 8px; }
    .exercise-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .exercise-item:last-child { border-bottom: none; }
    .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .exercise-name { font-weight: 600; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; display: block; }
    .last-weight { font-size: 0.75rem; color: var(--success); margin-top: 4px; font-weight: 500; }
    .set-row { display: grid; grid-template-columns: 45px 1fr 1fr 45px; gap: 8px; align-items: center; margin-bottom: 6px; }
    input[type="number"], input[type="text"], select, textarea { background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px; width: 100%; font-size: 0.9rem; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--success); cursor: pointer; }
    .recipe-card { margin-bottom: 12px; border-left: 3px solid var(--accent); cursor: pointer; transition: transform 0.2s; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .macro-box { background: #0b1120; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .macro-box span { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .macro-box strong { font-size: 1.1rem; color: var(--text); }
    
    /* Modales */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; backdrop-filter: blur(4px); }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--card); }
    .modal-header h3 { font-size: 1rem; color: var(--accent); margin: 0; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 4px; }
    .modal-body { padding: 16px; }
  </style>
</head>
<body>

<header>
  <h1 id="header-title">Entrenamiento</h1>
  <span id="current-date" style="font-size: 0.8rem; color: var(--muted);"></span>
</header>

<div class="container">
  <!-- TAB 1: ENTRENAR -->
  <section id="tab-train" class="tab-content active">
    <div class="card grid-2">
      <div>
        <label style="font-size: 0.75rem; color: var(--muted);">1. Modalidad</label>
        <select id="modality-select" onchange="updateSubroutines()">
          <option value="gym">Gymnasio</option>
          <option value="crossfit">CrossFit</option>
          <option value="hyrox">Hyrox</option>
          <option value="run">Running</option>
        </select>
      </div>
      <div>
        <label style="font-size: 0.75rem; color: var(--muted);">2. Sesión</label>
        <select id="routine-select" onchange="loadWorkout()"></select>
      </div>
    </div>

    <div class="timer-box">
      <div><div style="font-size: 0.7rem; color: var(--muted);">DESCANSO</div><div class="timer-display" id="timer">00:00</div></div>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-outline btn-sm" onclick="startTimer(60)">1m</button>
        <button class="btn btn-outline btn-sm" onclick="startTimer(90)">1.5m</button>
        <button class="btn btn-outline btn-sm" onclick="startTimer(120)">2m</button>
        <button class="btn btn-outline btn-sm" onclick="resetTimer()">✕</button>
      </div>
    </div>

    <div class="card" id="workout-container"></div>
    
    <div class="card">
      <label style="font-size: 0.8rem; color: var(--muted);">Notas de la sesión / RPE:</label>
      <textarea id="session-notes" rows="2" placeholder="Sensaciones del entreno..."></textarea>
      <button class="btn btn-block" onclick="saveSession()">Guardar Sesión</button>
    </div>
  </section>

  <!-- TAB 2: HISTORIAL -->
  <section id="tab-history" class="tab-content">
    <div style="margin-bottom: 16px;"><input type="text" id="search-input" placeholder="Buscar ejercicio, fecha..." oninput="renderHistory()"></div>
    <div id="history-list"></div>
  </section>

  <!-- TAB 3: NUTRICIÓN -->
  <section id="tab-nutrition" class="tab-content">
    <div class="card">
      <label style="font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; display:block;">Calculadora Dinámica (Kcal Objetivo):</label>
      <input type="number" id="cal-target" value="2600" step="50" onchange="calculateMacros()" style="font-size: 1.2rem; font-weight: bold; color: var(--accent); text-align: center; margin-bottom: 16px;">
      
      <div class="grid-2">
        <div class="macro-box"><span>Proteína (Fija)</span><strong id="macro-pro">150g</strong></div>
        <div class="macro-box"><span>Grasas (25%)</span><strong id="macro-fat">72g</strong></div>
        <div class="macro-box" style="grid-column: span 2;"><span>Carbohidratos (Resto)</span><strong id="macro-carb">338g</strong></div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--accent);">Opciones de Menú</h3>
      <select id="meal-type-select" onchange="renderMealList()" style="margin-bottom: 16px;">
        <option value="desayunos">Desayunos y Almuerzos</option>
        <option value="comidas">Comidas (Post-Entreno)</option>
        <option value="cenas">Cenas (Reparación)</option>
      </select>
      <div id="meal-catalog"></div>
    </div>
  </section>
</div>

<!-- NAV BAR -->
<nav class="nav-bar">
  <button class="nav-item active" onclick="switchTab('train')"><svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L7 5.57 15.57 14.14 12 17.71 13.43 19.14 14.86 17.71 17.71 20.57 19.14 19.14 20.57 20.57 22 19.14l-1.43-1.43z"/></svg>Entrenar</button>
  <button class="nav-item" onclick="switchTab('history')"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>Historial</button>
  <button class="nav-item" onclick="switchTab('nutrition')"><svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>Nutrición</button>
</nav>

<!-- MODALES -->
<div class="modal-overlay" id="recipeModal" onclick="if(event.target===this) this.style.display='none'">
  <div class="modal-content">
    <div class="modal-header"><h3 id="recipe-title">Receta</h3><button class="modal-close" onclick="document.getElementById('recipeModal').style.display='none'">&times;</button></div>
    <div class="modal-body">
      <h4 style="color: var(--accent); margin-bottom: 10px;">Ingredientes</h4>
      <ul id="recipe-ingredients" style="margin-left: 20px; font-size: 0.85rem; color: var(--muted); margin-bottom: 20px;"></ul>
      <h4 style="color: var(--accent); margin-bottom: 10px;">Preparación</h4>
      <p id="recipe-prep" style="font-size: 0.85rem; line-height: 1.6;"></p>
    </div>
  </div>
</div>

<script>
  // ESTRUCTURA DE DATOS DB_ROUTINES
  const dbRoutines = {
    gym: {
      upper: { title: "Tren Superior", exercises: [{name: "Press de banca en rack", sets: 4}, {name: "Jalón al pecho", sets: 4}, {name: "Press militar mancuernas", sets: 3}, {name: "Remo en máquina", sets: 3}, {name: "Aperturas pecho", sets: 3}] },
      lower: { title: "Tren Inferior & Core", exercises: [{name: "Sentadilla búlgara", sets: 4}, {name: "Prensa de piernas", sets: 4}, {name: "Extensiones cuádriceps", sets: 3}, {name: "Aductores / Abductores", sets: 3}, {name: "Rueda abdominal", sets: 4}] },
      full: { title: "Full Body Básico", exercises: [{name: "Prensa de piernas", sets: 4}, {name: "Press de banca en rack", sets: 4}, {name: "Jalón al pecho", sets: 4}, {name: "Rueda abdominal", sets: 3}] }
    },
    crossfit: {
      wod: { title: "WOD del día", exercises: [{name: "Acondicionamiento Metabólico", sets: 1, type: "text"}] },
      fuerza_wod: { title: "Fuerza + WOD", exercises: [{name: "Levantamiento Técnico", sets: 4}, {name: "WOD Corto", sets: 1, type: "text"}] }
    },
    hyrox: {
      sim: { title: "Simulación Hyrox", exercises: [{name: "Run + Ergómetros + Trineo", sets: 1, type: "text"}] }
    },
    run: {
      zona2: { title: "Fondo Zona 2", exercises: [{name: "Carrera Continua", sets: 1, type: "text"}] },
      series: { title: "Series / Intervalos", exercises: [{name: "Bloques de Velocidad", sets: 1, type: "text"}] }
    }
  };

  // ESTRUCTURA DE DATOS DB_NUTRITION
  const dbNutrition = {
    desayunos: [
      { name: "Porridge Energético Proteico", desc: "Avena con proteína y frutos rojos.", ingredients: ["50g Copos de avena", "Bebida de soja sin azúcar", "1 Scoop proteína vegetal", "Crema de cacahuete", "Plátano/Frutos rojos"], prep: "Calienta la avena con la bebida. Mezcla el scoop de proteína hasta espesar. Corona con los toppings." },
      { name: "Revuelto de Tofu en Tostadas", desc: "Simulación de huevo 100% vegetal.", ingredients: ["200g Tofu firme", "Pan de masa madre", "Levadura nutricional, cúrcuma, sal negra", "Espinacas"], prep: "Desmiga el tofu y saltea con cúrcuma y levadura. Añade sal negra al apagar el fuego. Sirve sobre tostadas." }
    ],
    comidas: [
      { name: "Pasta de Lentejas a la Boloñesa", desc: "Alto en proteína para post-entreno.", ingredients: ["90g Pasta de lentejas", "50g Soja texturizada", "Tomate triturado natural", "Orégano y ajo"], prep: "Hidrata la soja. Sofríe y añade tomate para reducir. Cuece la pasta y mezcla todo." },
      { name: "Ensalada Tibia de Garbanzos y Heura", desc: "Legumbres rápidas.", ingredients: ["200g Garbanzos de bote", "120g Heura/Seitán", "Espinacas frescas", "AOVE y vinagre"], prep: "Lava garbanzos. Dora la Heura. Mezcla sobre base de espinacas y aliña." }
    ],
    cenas: [
      { name: "Bowl Reparador de Quinoa y Tempeh", desc: "Carbohidrato moderado nocturno.", ingredients: ["80g Quinoa", "150g Tempeh marinado", "Brócoli o calabacín", "Salsa de soja"], prep: "Cuece la quinoa. Corta y saltea el tempeh y la verdura. Mezcla en un bowl." },
      { name: "Hamburguesa Vegetal y Espárragos", desc: "Cena ligera sin pan.", ingredients: ["1 Hamburguesa de legumbre (alubia/lenteja)", "Espárragos trigueros", "Champiñones"], prep: "Cocina a la plancha la hamburguesa y las verduras. Sirve directamente." }
    ]
  };

  // INICIALIZACIÓN
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
    updateSubroutines();
    calculateMacros();
    renderMealList();
    renderHistory();
  });

  // LÓGICA DE ENTRENAMIENTO (BÚSQUEDA DE PESOS INCLUIDA)
  function updateSubroutines() {
    const mod = document.getElementById('modality-select').value;
    const subSelect = document.getElementById('routine-select');
    subSelect.innerHTML = Object.keys(dbRoutines[mod]).map(key => `<option value="${key}">${dbRoutines[mod][key].title}</option>`).join('');
    loadWorkout();
  }

  function getLastWeight(exName) {
    const hist = JSON.parse(localStorage.getItem('hybrid_history') || '[]');
    for (let s of hist) {
      if(s.records) {
        const r = s.records.find(x => x.exercise === exName);
        if(r) return r.data;
      }
    }
    return "Sin registro previo";
  }

  function loadWorkout() {
    const mod = document.getElementById('modality-select').value;
    const sub = document.getElementById('routine-select').value;
    const routine = dbRoutines[mod][sub];
    const container = document.getElementById('workout-container');
    
    let html = `<div style="margin-bottom: 12px;"><h2 style="font-size: 1rem;">${routine.title}</h2></div>`;
    
    routine.exercises.forEach(ex => {
      const lastW = getLastWeight(ex.name);
      html += `<div class="exercise-item" data-ex-name="${ex.name}">
        <div class="exercise-header">
          <div><span class="exercise-name">${ex.name}</span><div class="last-weight">Última vez: ${lastW}</div></div>
        </div>`;
      
      if (ex.type === "text") {
        html += `<textarea rows="2" placeholder="Tiempo, rondas o detalles..." class="non-gym-notes"></textarea>`;
      } else {
        html += `<div style="display: grid; grid-template-columns: 45px 1fr 1fr 45px; gap: 8px; font-size: 0.75rem; text-align: center;"><span>Serie</span><span>Kg</span><span>Reps</span><span>OK</span></div>`;
        for (let i=1; i<=ex.sets; i++) {
          html += `<div class="set-row"><span>#${i}</span><input type="number" placeholder="Kg" class="input-kg"><input type="number" placeholder="Reps" class="input-reps"><input type="checkbox" onchange="if(this.checked) startTimer(90)"></div>`;
        }
      }
      html += `</div>`;
    });
    container.innerHTML = html;
  }

  // LÓGICA DE NUTRICIÓN DINÁMICA
  function calculateMacros() {
    const cals = parseInt(document.getElementById('cal-target').value);
    const pro = 150; // Constante basada en ~75kg
    const fat = Math.round((cals * 0.25) / 9);
    const carbs = Math.round((cals - (pro * 4) - (fat * 9)) / 4);
    
    document.getElementById('macro-pro').textContent = `${pro}g`;
    document.getElementById('macro-fat').textContent = `${fat}g`;
    document.getElementById('macro-carb').textContent = `${carbs}g`;
  }

  function renderMealList() {
    const type = document.getElementById('meal-type-select').value;
    const meals = dbNutrition[type];
    
    document.getElementById('meal-catalog').innerHTML = meals.map((m, i) => `
      <div class="card recipe-card" onclick="openRecipeModal('${type}', ${i})">
        <h3 style="font-size:0.95rem;">${m.name} ›</h3>
        <p style="font-size:0.85rem; color:var(--muted);">${m.desc}</p>
      </div>
    `).join('');
  }

  function openRecipeModal(type, i) {
    const recipe = dbNutrition[type][i];
    document.getElementById('recipe-title').textContent = recipe.name;
    document.getElementById('recipe-ingredients').innerHTML = recipe.ingredients.map(ing => `<li>${ing}</li>`).join('');
    document.getElementById('recipe-prep').textContent = recipe.prep;
    document.getElementById('recipeModal').style.display = 'flex';
  }

  // GUARDADO E HISTORIAL
  function saveSession() {
    let records = [];
    document.querySelectorAll('.exercise-item').forEach(el => {
      const name = el.getAttribute('data-ex-name'), kgInputs = el.querySelectorAll('.input-kg'), repsInputs = el.querySelectorAll('.input-reps');
      if (kgInputs.length > 0) {
        let setsData = []; 
        kgInputs.forEach((inp, i) => { if (inp.value || repsInputs[i].value) setsData.push(`${inp.value||0}kg x ${repsInputs[i].value||0}`); });
        if (setsData.length > 0) records.push({ exercise: name, data: setsData.join(' | ') });
      } else { 
        const note = el.querySelector('.non-gym-notes'); 
        if (note && note.value) records.push({ exercise: name, data: note.value }); 
      }
    });
    
    if(records.length === 0 && !document.getElementById('session-notes').value) return alert("Rellena algún dato antes de guardar.");
    
    const mod = document.getElementById('modality-select').value;
    const sub = document.getElementById('routine-select').value;
    
    let history = JSON.parse(localStorage.getItem('hybrid_history') || '[]');
    history.unshift({ 
      id: Date.now(), 
      displayDate: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }), 
      title: dbRoutines[mod][sub].title, 
      records: records, 
      notes: document.getElementById('session-notes').value 
    });
    localStorage.setItem('hybrid_history', JSON.stringify(history)); 
    alert('Sesión registrada en el historial.'); 
    document.getElementById('session-notes').value = ''; 
    loadWorkout(); // Resetea inputs
    renderHistory();
  }

  function renderHistory() {
    const q = (document.getElementById('search-input')?.value || '').toLowerCase();
    let history = JSON.parse(localStorage.getItem('hybrid_history') || '[]').filter(i => i.title.toLowerCase().includes(q) || i.displayDate.includes(q) || i.records.some(r => r.exercise.toLowerCase().includes(q)));
    
    document.getElementById('history-list').innerHTML = history.length ? history.map(s => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <strong>${s.title}</strong>
          <button onclick="if(confirm('¿Borrar?')){localStorage.setItem('hybrid_history', JSON.stringify(JSON.parse(localStorage.getItem('hybrid_history')).filter(i => i.id !== ${s.id}))); renderHistory();}" style="background:none;border:none;color:#ef4444;">✕</button>
        </div>
        <div style="font-size:0.75rem;color:var(--muted);">${s.displayDate}</div>
        <div style="font-size:0.85rem; margin-top:8px;">
          ${s.records.map(r => `<div><strong>${r.exercise}:</strong> <span style="color:var(--accent);">${r.data}</span></div>`).join('')}
          ${s.notes ? `<div style="color:var(--muted); font-style:italic; margin-top:6px;">"${s.notes}"</div>` : ''}
        </div>
      </div>`).join('') : '<div style="text-align:center;color:var(--muted);">Sin registros</div>';
  }

  // UTILIDADES (Temporizador y Pestañas)
  let timerInterval;
  function startTimer(sec) {
    clearInterval(timerInterval); let rem = sec; const d = document.getElementById('timer'); d.style.color = 'var(--accent)';
    timerInterval = setInterval(() => { d.textContent = `${Math.floor(rem/60).toString().padStart(2,'0')}:${(rem%60).toString().padStart(2,'0')}`; if(rem--<=0){clearInterval(timerInterval); d.style.color='var(--success)'; if(navigator.vibrate) navigator.vibrate([200,100,200]);} }, 1000);
  }
  function resetTimer() { clearInterval(timerInterval); document.getElementById('timer').textContent = "00:00"; document.getElementById('timer').style.color = 'var(--text)'; }
  function switchTab(t) { document.querySelectorAll('.tab-content, .nav-item').forEach(e => e.classList.remove('active')); document.getElementById(`tab-${t}`).classList.add('active'); document.querySelectorAll('.nav-item')[['train','history','nutrition'].indexOf(t)].classList.add('active'); document.getElementById('header-title').textContent = {train:'Entrenamiento', history:'Historial', nutrition:'Nutrición'}[t]; }
</script>
</body>
</html>
